# Checks from the outside that the domain resolves and the site answers fast.
name: site check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/site-check.yml']
permissions:
  contents: read
  pages: read
  deployments: read
  statuses: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: DNS
        continue-on-error: true
        run: |
          sudo apt-get -qq install -y dnsutils >/dev/null 2>&1 || true
          for h in rogerboujieka.com www.rogerboujieka.com; do
            for t in NS A AAAA CNAME CAA; do
              echo "== $h $t (8.8.8.8)"; dig +short @8.8.8.8 $h $t
              echo "== $h $t (1.1.1.1)"; dig +short @1.1.1.1 $h $t
            done
          done
          NS=$(dig +short @8.8.8.8 rogerboujieka.com NS | head -1)
          echo "== authoritative $NS"
          for h in rogerboujieka.com www.rogerboujieka.com; do for t in A AAAA CNAME; do echo "-- $h $t"; dig +short @$NS $h $t; done; done
      - name: HTTP
        continue-on-error: true
        run: |
          for u in https://rogerboujieka.com/ https://www.rogerboujieka.com/ http://rogerboujieka.com/ http://www.rogerboujieka.com/ https://rogerboujieka.github.io/VIBE-MOTION---MASTER-CLASS/; do
            echo "== $u"
            curl -sS -o /dev/null -m 25 -w 'code=%{http_code} ip=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s redirect=%{redirect_url}\n' "$u" || true
          done
          echo "== follow redirects from the apex (what Facebook opens)"
          curl -sSL -o /dev/null -m 40 -w 'final=%{url_effective} code=%{http_code} redirects=%{num_redirects} total=%{time_total}s size=%{size_download}\n' https://rogerboujieka.com/ || true
          for ip in $(dig +short @8.8.8.8 rogerboujieka.com A); do echo "== apex via $ip"; curl -sS -o /dev/null -m 15 --resolve rogerboujieka.com:443:$ip -w 'code=%{http_code} connect=%{time_connect}s total=%{time_total}s\n' https://rogerboujieka.com/ || true; done
          for ip in $(dig +short @8.8.8.8 rogerboujieka.com AAAA); do echo "== apex has IPv6 $ip"; whois $ip 2>/dev/null | grep -iE 'netname|org-name|descr' | head -3; done
      - name: TLS certificates
        continue-on-error: true
        run: |
          for h in rogerboujieka.com www.rogerboujieka.com; do
            echo "== $h"
            echo | timeout 20 openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || echo "no certificate"
          done
      - name: GitHub Pages settings
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api repos/${{ github.repository }}/pages || true
      - name: Live version
        continue-on-error: true
        run: |
          html=$(curl -sS --compressed -m 20 "https://www.rogerboujieka.com/?v=$RANDOM")
          echo "google fonts links: $(echo "$html" | grep -c 'fonts.googleapis')"
          echo "deferred video thumbnails: $(echo "$html" | grep -o 'data-poster=' | wc -l)"
          curl -sS -o /dev/null -D - --compressed https://www.rogerboujieka.com/ | grep -iE '^(http|content-encoding|cache-control|age|x-cache|last-modified)'
          curl -sS -o /dev/null --compressed -w 'html over the wire: %{size_download} bytes in %{time_total}s\n' https://www.rogerboujieka.com/
          for f in roger.webp thumbs/work-bovann.jpg fonts/inter-tight.woff2; do curl -sS -o /dev/null -w "$f: %{http_code} %{size_download} bytes\n" https://www.rogerboujieka.com/$f; done
      - name: Old copies and links
        continue-on-error: true
        run: |
          for u in https://rogerboujieka.github.io/ https://rogerboujieka.github.io/RogerBOUJIEKA/ https://rogerboujieka.github.io/RogerBOUJIEKA/masterclass-ia/ https://www.rogerboujieka.com/masterclass-ia/ https://rogerboujieka237.mychariow.shop/prd_gy9104l1/checkout; do
            echo "== $u"
            curl -sSL -m 25 -o /tmp/p.html -w 'code=%{http_code} final=%{url_effective}\n' "$u" || true
            echo "title: $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"
            echo "mentions masterclass: $(grep -oi 'masterclass' /tmp/p.html | wc -l) · vendredi/octobre: $(grep -oiE 'vendredi|octobre' /tmp/p.html | wc -l) · formation: $(grep -oi 'formation' /tmp/p.html | wc -l)"
          done
          echo "== live page wording"
          curl -sS --compressed https://www.rogerboujieka.com/ | grep -oE 'Formation vidéo · Accès immédiat|J.accède à la formation|<title>[^<]*' | sort | uniq -c
      - name: Chariow checkout as a phone browser
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; SM-A145F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36'
          for u in https://rogerboujieka237.mychariow.shop/prd_gy9104l1/checkout https://rogerboujieka237.mychariow.shop/prd_gy9104l1 https://rogerboujieka237.mychariow.shop/; do
            echo "== $u"
            curl -sS -L -m 30 -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: fr-FR,fr;q=0.9' -D /tmp/h.txt -o /tmp/c.html -w 'code=%{http_code} final=%{url_effective} size=%{size_download}\n' "$u" || true
            grep -iE '^(HTTP|server|location|x-powered|cf-ray|content-type)' /tmp/h.txt | head -8
            python3 -c "import re,html;t=open('/tmp/c.html',encoding='utf-8',errors='ignore').read();m=re.search(r'<title>(.*?)</title>',t,re.S);print('title:',m.group(1).strip()[:120] if m else '-');x=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S);x=html.unescape(re.sub(r'<[^>]+>',' ',x));print('text:',re.sub(r'\\s+',' ',x).strip()[:700])"
          done
      - name: Chariow details
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; SM-A145F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36'
          curl -sS -L -m 30 -A "$UA" -o /tmp/c.html https://rogerboujieka237.mychariow.shop/prd_gy9104l1/checkout || true
          echo "--- hints inside the checkout error page"
          grep -oiE '"(statusCode|status|message|error|digest|code)"[^,}]{0,120}|Application error[^<]{0,120}|Internal Server Error|Something went wrong[^<]{0,80}|maintenance[^<"]{0,80}|suspend[^<"]{0,80}|introuvable[^<"]{0,80}|not found[^<"]{0,60}' /tmp/c.html | sort | uniq -c | head -20
          echo "--- other Chariow pages for comparison"
          for u in https://chariow.com/ https://www.chariow.com/ https://app.chariow.com/; do curl -sS -o /dev/null -m 25 -A "$UA" -w "$u code=%{http_code}\n" "$u" || true; done
      - name: Vercel
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          echo "--- deployments reported to GitHub"
          gh api "repos/${{ github.repository }}/deployments?per_page=5" --jq '.[] | "\(.created_at) env=\(.environment) creator=\(.creator.login) sha=\(.sha[0:7]) id=\(.id)"' || true
          for id in $(gh api "repos/${{ github.repository }}/deployments?per_page=3" --jq '.[].id' 2>/dev/null); do
            gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0] | "  status=\(.state) url=\(.environment_url // .target_url)"' || true
          done
          echo "--- commit statuses on main"
          gh api "repos/${{ github.repository }}/commits/main/status" --jq '.statuses[] | "\(.context) \(.state) \(.target_url)"' || true
          gh api "repos/${{ github.repository }}/commits/main/check-runs" --jq '.check_runs[] | "\(.name) \(.conclusion) \(.details_url)"' || true
          echo "--- candidate vercel addresses"
          for u in https://vibemotion.vercel.app https://vibemotion-roger-boujieka.vercel.app https://vibemotion-git-main-roger-boujieka.vercel.app; do
            curl -sSL -m 20 -o /tmp/v.html -w "$u code=%{http_code} final=%{url_effective}\n" "$u" || true
            echo "   title: $(grep -o '<title>[^<]*' /tmp/v.html | head -1) · formation hero: $(grep -c 'Formation vidéo · Accès immédiat' /tmp/v.html)"
          done
      - name: What Vercel serves on the apex
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; SM-A145F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36'
          for u in https://rogerboujieka.com/ https://www.rogerboujieka.com/; do
            echo "== $u (phone browser)"
            curl -sS -L -m 25 -A "$UA" -H 'Accept: text/html' -D /tmp/h.txt -o /tmp/a.html -w 'code=%{http_code} final=%{url_effective}\n' "$u"
            grep -iE '^(HTTP|server|x-vercel|location|cache-control)' /tmp/h.txt | head -8
            echo "title: $(grep -o '<title>[^<]*' /tmp/a.html | head -1) · formation hero: $(grep -c 'Formation vidéo · Accès immédiat' /tmp/a.html) · checkpoint: $(grep -ci 'checkpoint\|challenge' /tmp/a.html)"
          done
      - name: Chariow product thumbnail format
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; SM-A145F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36'
          curl -sS -L -m 30 -A "$UA" -o /tmp/s.html https://rogerboujieka237.mychariow.shop/
          echo "--- original product images and their size"
          for u in $(grep -oE 'https://assets\.chariowcdn\.com/(assets|thumbnail_pictures)/[^" ,]+\.(png|jpe?g|webp)' /tmp/s.html | sort -u | head -6); do
            curl -sS -m 20 -o /tmp/i.bin "$u" && echo "$u -> $(file -b /tmp/i.bin | grep -oE '[0-9]+ ?x ?[0-9]+' | tail -1)"
          done
          echo "--- box around each product image"
          grep -oE '.{0,500}assets\.chariowcdn\.com/(assets|thumbnail_pictures)' /tmp/s.html | grep -oE 'class="[^"]*"' | sort | uniq -c | head -12
          echo "--- product page images"
          curl -sS -L -m 30 -A "$UA" -o /tmp/p.html https://rogerboujieka237.mychariow.shop/prd_gy9104l1
          for u in $(grep -oE 'https://assets\.chariowcdn\.com/[^" ,]+\.(png|jpe?g|webp)' /tmp/p.html | grep -v store_logos | sort -u | head -6); do
            curl -sS -m 20 -o /tmp/i.bin "$u" && echo "$u -> $(file -b /tmp/i.bin | grep -oE '[0-9]+ ?x ?[0-9]+' | tail -1)"
          done
          grep -oE '.{0,400}assets\.chariowcdn\.com/(assets|thumbnail_pictures)' /tmp/p.html | grep -oE 'class="[^"]*"' | sort | uniq -c | head -8
